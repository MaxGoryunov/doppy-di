config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Local-only secrets file (gitignored). Never scanned or uploaded.
  ".env",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "trufflehog"

# Lob detector false-positives on pytest names (test_*): matcher treats
# `test_...` function names as Lob test API keys. Real secrets never live in tests.
[[triage]]
match.plugins = ["trufflehog"]
match.file_patterns = ["tests/**"]
set.ignored = true

# `_legacy.py` is a frozen performance baseline kept for before/after
# comparison with the current compiled plan (see
# issues/45-resolve-hotpath-optimizations.md and benchmarks/compare_120.py).
# It is not public API and is deliberately not refactored, because rewriting
# it would invalidate the baseline it exists to measure against.
[[triage]]
match.plugins = ["radarlint-python"]
match.file_patterns = ["src/doppy_di/_legacy.py"]
set.ignored = true

# npm's own bundled dependencies (`node_modules/npm/node_modules/**`) carry
# these advisories. They come in only through the dev-only semantic-release
# toolchain, are never shipped with the wheel, and can only be refreshed by
# npm itself regenerating package-lock.json (`npm install`) - node/npm are not
# part of this project's build. Revisit when the lock file is next regenerated.
[[triage]]
match.plugins = ["osv-scanner"]
match.file_patterns = ["package-lock.json"]
match.rules = [
  "CVE-2026-48758",
  "CVE-2026-9496",
  "CVE-2026-48815",
  "CVE-2026-93687",
  "CVE-2026-93748",
]
set.ignored = true


[[plugin]]
name = "zizmor"
