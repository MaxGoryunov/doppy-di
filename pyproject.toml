[build-system]
requires = [
    "hatchling>=1.25",
    "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "doppy-di"
dynamic = ["version"]
description = "Minimal dependency injection container"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "doppy maintainers" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MaxGoryunov/doppy-di"
Repository = "https://github.com/MaxGoryunov/doppy-di"

[project.optional-dependencies]
dev = [
    "mypy>=1.16,<2",
    "nox>=2025.5.1",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "uv>=0.11",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doppy_di"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PT", "RUF", "SIM", "UP", "W"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/doppy_di"]
exclude = ['(^|/)noxfile\.py$', '\.venv/', 'venv/', 'tests/']

[[tool.mypy.overrides]]
module = "noxfile"
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--cov=src/doppy_di --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/doppy_di"]

[dependency-groups]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
