[build-system]
requires = [
    "hatchling>=1.25",
    "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "doppy-di"
dynamic = ["version"]
description = "Minimal dependency injection container"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "doppy maintainers" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "typing_extensions>=4.5",
    "click>=8.0",
]

[project.scripts]
doppy-di = "doppy_di.cli:cli"

[project.urls]
Homepage = "https://github.com/MaxGoryunov/doppy-di"
Repository = "https://github.com/MaxGoryunov/doppy-di"

[project.optional-dependencies]
dev = [
    "mypy>=1.16,<2",
    "nox>=2025.5.1",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "uv>=0.11",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
fastapi = [
    "fastapi",
]
aiogram = [
    "aiogram",
]
typer = [
    "typer",
]
otel = [
    "opentelemetry-api>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doppy_di"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PT", "RUF", "SIM", "UP", "W"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = false
files = ["src/doppy_di", "tests/typing_checks.py"]
mypy_path = "src"
exclude = ['(^|/)noxfile\.py$', '\.venv/', 'venv/', 'tests/', 'benchmarks/']

[[tool.mypy.overrides]]
module = "noxfile"
ignore_errors = true

[[tool.mypy.overrides]]
module = "doppy_di.ext.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["click", "click.testing"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tomllib",
    "punq",
    "wireup",
    "dependency_injector.*",
    "dishka",
    "injex",
    "lagom",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src/doppy_di --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/doppy_di"]
omit = ["src/doppy_di/_legacy.py"]

[dependency-groups]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
