name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
# zizmor: ignore[dangerous-triggers] release only runs after CI success on same repo (guard below)

permissions:
  contents: read

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] - credentials required for semantic-release git push
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true # nosonar githubactions:S8544 first-party action pinned by SHA above

      - name: Install Python
        run: uv python install 3.12

      - name: Install Node dependencies
        run: npm ci --ignore-scripts # nosonar githubactions:S6505,S8543 --ignore-scripts, package-lock.json pins versions

      - name: Install Python dependencies
        run: uv sync --frozen --extra dev # nosonar githubactions:S8541,S8544 lockfile+frozen, no setup.py

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run semantic-release
      
      - run: git fetch --tags

      - name: Switch to the released tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "Switching to tag $LATEST_TAG"
          git checkout $LATEST_TAG

      - name: Build package
        run: uv build # nosonar githubactions:S8541 hatchling backend, no setup.py execution

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
