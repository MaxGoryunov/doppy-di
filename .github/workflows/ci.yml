name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true # nosonar githubactions:S8544 first-party action pinned by SHA above

      - name: Install deps
        run: uv sync --frozen --extra dev --extra fastapi --extra aiogram --extra typer # nosonar githubactions:S8541,S8544 lockfile+frozen, no setup.py

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Check docstring sections use plural Examples
        run: |
          if grep -rn "Example:" src/; then
            echo "Use 'Examples:' (plural) so mkdocstrings renders code blocks with newlines"
            exit 1
          fi

      - name: Mypy strict
        run: uv run mypy

      - name: Build wheel
        run: uv build # nosonar githubactions:S8541 hatchling backend, no setup.py execution

      - name: Verify PEP 561 compliance
        run: |
          pip install mypy dist/*.whl
          echo "from doppy_di.container import Container; reveal_type(Container)" > /tmp/check_container.py
          echo "from doppy_di.devkit import LoggingContainer; reveal_type(LoggingContainer)" > /tmp/check_devkit.py
          python -m mypy --strict /tmp/check_container.py
          python -m mypy --strict /tmp/check_devkit.py
          pip uninstall -y doppy-di

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Node deps
        run: npm ci # nosonar githubactions:S6505,S8543 package-lock.json pins versions; registry deps only

      - name: Commitlint (PR)
        if: github.event_name == 'pull_request'
        # nosonar githubactions:S6505,S8543 --no-install, package-lock.json pinned
        run: |
          npx --no-install commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}

      - name: Commitlint (Push)
        if: github.event_name == 'push'
        # nosonar githubactions:S6505,S8543 --no-install, package-lock.json pinned
        run: |
          npx --no-install commitlint \
            --from HEAD~1 \
            --to HEAD

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true # nosonar githubactions:S8544 first-party action pinned by SHA above

      - name: Install deps
        run: uv sync --frozen --extra dev --extra fastapi --extra aiogram --extra typer # nosonar githubactions:S8541,S8544 lockfile+frozen, no setup.py

      - name: Run tests
        run: uv run pytest --cov --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0

      - name: Run analyzers
        run: qlty check

  # SonarCloud FREE plan supports default-branch analysis and pull-request
  # analysis for public repos, but not analysis of other long-lived branches.
  # The scan therefore runs on pull requests and on pushes to the default
  # branch. Skipped (green) when the SONAR_TOKEN secret is not configured.
  sonarcloud:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for accurate new-code / blame data
          persist-credentials: false

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}