# SonarCloud project configuration.
#
# The SonarCloud organization is on the FREE plan, which supports pull-request
# analysis for public repositories but not long-lived branch analysis. CI runs
# this scan on `pull_request` events only.
sonar.projectKey=MaxGoryunov_doppy-di
sonar.organization=maxgoryunov
sonar.projectName=doppy-di
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12
# Frozen performance baseline, kept only for before/after comparison; excluded
# to match the qlty triage in .qlty/qlty.toml.
sonar.exclusions=src/doppy_di/_legacy.py
